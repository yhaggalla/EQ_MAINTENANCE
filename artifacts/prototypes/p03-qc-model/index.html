<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>Open crane viewer</title></head>
<body><p id="message">Opening the shared crane viewer…</p><a id="open" href="http://127.0.0.1:5312/">Open EQ &amp; FAC Maintenance</a>
<script type="module">
// Compatibility entry for saved P03 links. There is one interactive viewer, on the equipment page.
const old = new URLSearchParams(location.search), q = new URLSearchParams();
const eq = ['eq-qc-demo-01', 'eq-qc-demo-02'].includes(old.get('eq')) ? old.get('eq') : 'eq-qc-demo-01';
for (const key of ['main', 'sub', 'container', 'mode', 'iso', 'panel']) if (old.has(key)) q.set(key, old.get(key));
q.set('view', old.get('view') === 'side' || old.get('view') === 'flat' ? 'flat' : '3d');
try {
  if (old.has('pkey')) q.set('pkey', old.get('pkey'));
  else if (old.has('part')) {
    const response = await fetch((location.pathname.startsWith('/qc/') ? '../' : '') + 'models/cict-j526a-sts-scene/1/manifest.json');
    if (!response.ok) throw new Error('manifest');
    const manifest = await response.json(), nodes = manifest.nodes.filter(n => n.kind === 'position');
    const prefix = eq === 'eq-qc-demo-01' ? 'pp-q01-' : 'pp-q02-';
    const id = old.get('part'), index = id.startsWith(prefix) ? Number(id.slice(prefix.length)) - 1 : -1;
    if (Number.isInteger(index) && nodes[index]) q.set('pkey', nodes[index].key.replaceAll('.', '_'));
    else q.set('part', 'invalid-legacy-part');
  }
  const target = location.pathname.startsWith('/qc/') ? new URL('../', location.href) : new URL('http://' + location.hostname + ':5312/');
  target.search = '?role=management'; target.hash = '/eq/equipment/' + eq + '?' + q;
  document.getElementById('open').href = target.href;
  location.replace(target.href);
} catch { document.getElementById('message').textContent = 'The saved part link could not be resolved. Open the equipment viewer and select it from the tree.'; }
</script></body></html>
